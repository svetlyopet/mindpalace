{{define "partials/sidebar.html"}}
<nav class="sidebar-nav">
  <a href="/" class="{{.NavLibraryClass}}">Library</a>
  <a href="/tags" class="{{.NavTagsClass}}">Tags</a>
</nav>

{{if .Tag}}
<p class="sidebar-active-tag">
  Tag: <span class="tag">{{.Tag}}</span>
  <a href="/" class="clear-tag" title="Clear tag filter">×</a>
</p>
{{end}}

<div class="sidebar-filters">
  <label class="filter-label">Type
    <select name="type" form="filters">
      <option value="">All types</option>
      {{range .TypeOptions}}
      {{if .Selected}}<option value="{{.Value}}" selected="selected">{{.Label}}</option>{{else}}<option value="{{.Value}}">{{.Label}}</option>{{end}}
      {{end}}
    </select>
  </label>
  <label class="filter-label">Since
    <input type="text" name="since" form="filters" placeholder="2w" value="{{.Since}}">
  </label>
</div>

<div id="entry-list" class="entry-list">
  {{template "partials/entries.html" .}}
</div>
{{end}}
