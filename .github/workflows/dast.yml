name: dast

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build mp
        run: make build

      - name: Prepare vault and sample entry
        env:
          MINDPALACE_VAULT: ${{ runner.temp }}/mindpalace-vault
        run: |
          set -euo pipefail
          ./bin/mp vault init "$MINDPALACE_VAULT"
          ./bin/mp add note -m "DAST fixture note" --title "DAST fixture" --tags dast

      - name: Start mp serve
        env:
          MINDPALACE_VAULT: ${{ runner.temp }}/mindpalace-vault
        run: |
          set -euo pipefail
          ./bin/mp serve --addr 127.0.0.1:7451 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:7451/unlock >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "mp serve did not become ready" >&2
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:7451/
          cmd_options: -a

      - name: Stop mp serve
        if: always()
        run: |
          if [[ -n "${SERVE_PID:-}" ]]; then
            kill "$SERVE_PID" 2>/dev/null || true
          fi
          pkill -f 'bin/mp serve' 2>/dev/null || true
