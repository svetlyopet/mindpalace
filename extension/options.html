<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindpalace extension options</title>
  <style>
    body {
      font: 14px/1.5 system-ui, sans-serif;
      margin: 0 auto;
      padding: 1.5rem;
      max-width: 36rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    .lead { color: #555; margin: 0 0 1.25rem; }
    ol { margin: 0 0 1.25rem; padding-left: 1.25rem; color: #444; }
    ol li { margin-bottom: 0.35rem; }
    code { font-size: 0.9em; background: #f0f0f0; padding: 0.1em 0.35em; border-radius: 4px; }
    label { display: block; font-size: 0.75rem; text-transform: uppercase; color: #666; margin: 0.75rem 0 0.25rem; }
    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.45rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
    }
    .token-row { display: flex; gap: 0.5rem; align-items: stretch; }
    .token-row input { flex: 1; }
    .token-row button {
      font: inherit;
      padding: 0 0.65rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; align-items: center; }
    button.primary {
      font: inherit;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #1a1a1a;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
    }
    button.secondary {
      font: inherit;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    .msg { min-height: 1.25em; margin-top: 0.75rem; font-size: 0.9rem; }
    .msg.ok { color: #0d6b0d; }
    .msg.err { color: #b00020; }
    label.capture-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 1rem 0 0;
      font-size: inherit;
      text-transform: none;
      color: inherit;
      cursor: pointer;
    }
    label.capture-option input { width: auto; }
  </style>
</head>
<body>
  <h1>Mindpalace Capture</h1>
  <p class="lead">Connect this extension to your local <code>mp serve</code> instance.</p>
  <ol>
    <li>Run <code>mp serve</code> and unlock the vault in the browser if it is encrypted.</li>
    <li>Open your vault <code>config.yaml</code> and copy <code>serve.token</code>.</li>
    <li>Paste the server URL and token below, then test and save.</li>
  </ol>
  <label for="baseUrl">Server base URL</label>
  <input type="url" id="baseUrl" placeholder="http://127.0.0.1:7451" autocomplete="off">
  <label for="token">API token (<code>serve.token</code>)</label>
  <div class="token-row">
    <input type="password" id="token" autocomplete="off">
    <button type="button" id="toggle-token" aria-label="Show token">Show</button>
  </div>
  <label class="capture-option">
    <input type="checkbox" id="defaultFullHtml">
    Default: save full HTML bundle
  </label>
  <div class="actions">
    <button type="button" class="primary" id="save">Save</button>
    <button type="button" class="secondary" id="test">Test connection</button>
  </div>
  <p class="msg" id="status"></p>
  <script src="options.js"></script>
</body>
</html>
